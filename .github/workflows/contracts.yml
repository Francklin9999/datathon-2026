name: Contracts, API and infrastructure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: npm ci
      - run: npm --prefix infra ci
      - run: npm run check
        env:
          UV_OFFLINE: 'true'
