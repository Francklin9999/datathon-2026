[project]
name = "aplomb"
version = "0.1.0"
description = "Aplomb shared contracts and deterministic integration checks"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.14.3"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/aplomb"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
